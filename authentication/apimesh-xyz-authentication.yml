note: >-
  Neither served OpenAPI declares a securityScheme (derive-authentication.py found none), so this
  profile is read from the documents that do describe access: the agent card's securitySchemes
  block, the MPP manifest's payment_methods, the README and llms-full.txt. The marketplace model
  was "pay, don't authenticate": an anonymous request to a paid endpoint received HTTP 402 with a
  WWW-Authenticate: Payment challenge and the client either paid per request (x402 USDC on Base,
  or Stripe MPP) or presented a prepaid-credit Bearer key. The two endpoints that are live today
  (agentsmd POST /normalize, stripesig POST /check) require no credential at all — confirmed
  2026-09-19 with anonymous 200/400 responses. The one authenticated write observed, PUT
  /wallet/{address}/cap, returned 401 anonymously and its credential type is undocumented.

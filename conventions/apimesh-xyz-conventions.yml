auth:
  style: >-
    Three access modes documented for the marketplace: (1) Bearer API key in the Authorization
    header, prefixed sk_live_, bought as prepaid credits at /signup via Stripe; (2) x402 — call,
    receive 402 with WWW-Authenticate: Payment, sign a USDC payment on Base, retry with the payment
    header; (3) MPP (Stripe Machine Payments Protocol) over the same 402 challenge. The two live
    wedge endpoints require no authentication at all. The wallet-cap write (PUT /wallet/{address}/cap)
    returned 401 anonymously; how it is authenticated is undocumented.
  detail: authentication/apimesh-xyz-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  retention: null
  description: >-
    No Idempotency-Key header or equivalent is documented or declared anywhere. The live write
    surface is pure computation — POST /normalize and POST /check derive a response from the
    request body and store nothing — so a replay is naturally harmless; the documented paid model
    (credit deducted per call, x402 payment per call) has NO replay protection: a retried paid
    call is charged again. PUT /wallet/{address}/cap is a last-write-wins setter.
reversibility:
  status: documented
  grade_basis: >-
    One reversal path exists with no stated window. Payments: per-call credits and x402/MPP
    micropayments are final — the Refund and Credit Policy states "Prepaid API credits are
    non-refundable once purchased" and "Once credits are added to your account, the transaction
    is final", with corrections only for billing errors or duplicate charges. Spend caps: a
    wallet cap set with PUT /wallet/{address}/cap can be replaced by setting it again (the MCP
    tool wallet_set_cap describes it as replaceable), which is a reversal path for the one
    persistent write, but no window or removal semantics are published. Account: deletion on
    request to support, data erased within 30 days (Privacy §4). The analysis endpoints
    themselves are read-only computations with nothing to undo.
  write_surfaces:
  - operation: 'PUT /wallet/{address}/cap'
    reversal: 'PUT /wallet/{address}/cap again with new limits (last-write-wins)'
    window: not stated
    docs: https://github.com/mbeato/APIMesh#wallet--spend-tracking-free-no-auth
  - operation: 'paid API call (credit deduction / x402 / MPP payment)'
    reversal: none — non-refundable by policy; billing errors and duplicate charges corrected on request
    window: not stated
    docs: https://apimesh.xyz/legal/refund
  - operation: 'POST /normalize, POST /check'
    reversal: na — stateless computation
  read_only_surface: all analysis endpoints (GET /check, /preview, /analyze, /scan; POST /build, /generate, /validate)

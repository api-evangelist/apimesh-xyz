aid: apimesh-xyz
name: APIMesh
description: >-
  APIMesh (apimesh.xyz) is a solo, MIT-licensed developer-tools project by Maximus Beato that
  launched in February 2026 as a pay-per-call web-analysis API marketplace — SEO audits, security
  headers, email verification, tech-stack detection and dozens of autonomously generated
  endpoints, each on its own subdomain and payable by x402 (USDC on Base), Stripe Machine
  Payments Protocol or prepaid API-key credits, with a 76-tool MCP server on npm. The marketplace
  was retired on 2026-05-11 and the domain now hosts two free "wedge" tools: agentsmd (normalize
  AGENTS.md, CLAUDE.md and other agent rules files via POST /normalize, a CLI and an MCP server)
  and stripesig (a webhook signature debugger for Stripe, GitHub, Slack and Shopify via POST
  /check). The A2A agent card, ai-plugin manifest, OpenAPI, llms.txt and x402/MPP discovery
  documents are still served and describe the retired surface.

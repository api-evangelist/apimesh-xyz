apis:
- name: agentsmd (agentcontext) API
  description: >-
    Live, free, unauthenticated endpoint behind the agentsmd wedge: POST /normalize accepts {source_format,
    content, targets} and returns {files, warnings, detected_formats}, converting between AGENTS.md, CLAUDE.md,
    GEMINI.md, .cursor/rules/*.mdc, .windsurf/rules/*.md, .clinerules/*.md and CONVENTIONS.md. Rate-limited
    30 requests per 60 s per IP with X-RateLimit-* headers. The same conversion ships as the @mbeato/agentcontext
    CLI/library and the @mbeato/agentcontext-mcp server. Not described by any served OpenAPI.
  humanURL: https://agentsmd.apimesh.xyz/
  baseURL: https://agentsmd.apimesh.xyz
  tags:
  - AI Coding Agents
  - Developer Tools
  - Open Source

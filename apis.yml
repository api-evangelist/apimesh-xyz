- name: APIMesh MCP Server
  description: >-
    @mbeato/apimesh-mcp-server (npm, v1.8.2, 2026-04-26; io.github.mbeato/apimesh in the official MCP
    registry) — a local stdio MCP server with 76 tools (74 web-analysis tools plus wallet_usage and wallet_set_cap)
    whose tools call the pay-per-call hosts on *.apimesh.xyz and the wallet endpoints on apimesh.xyz.
    No remote MCP endpoint exists (mcp.apimesh.xyz was retired). The tools' upstream hosts have been retired
    since 2026-05-11, so calls return 404; the package remains installable. A second stdio server, @mbeato/agentcontext-mcp,
    exposes the agentsmd conversion as two tools.
  humanURL: https://www.npmjs.com/package/@mbeato/apimesh-mcp-server

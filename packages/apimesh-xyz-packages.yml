note: >-
  Three first-party npm packages, all published under the operator's @mbeato scope (the same
  GitHub account that owns github.com/mbeato/APIMesh and is named on apimesh.xyz). No PyPI
  (pypi.org/pypi/apimesh/json 404), Maven, NuGet, Go, RubyGems, Packagist or crates.io packages
  exist; the unscoped npm "apimesh" (1.0.0, 2016) and "@adobe-apimesh/*" belong to unrelated
  projects and are excluded. None of the three is a REST client SDK — they are an MCP server, a
  CLI/library, and a second MCP server — so SDKs is wired for the count but a buyer wanting a
  typed HTTP client has nothing to install. version/published read from registry.npmjs.org on
  2026-09-19. The newest release is 2026-04-29; the marketplace the largest package wraps was
  retired 2026-05-11, so the package's tools now call 404 hosts.
